name: Deploy Doxygen

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make pkgconf zlib1g-dev libssl-dev \
            libarchive-dev doxygen graphviz
      - uses: actions/checkout@v4
      - name: Build
        run: |
          ./configure --enable-api-docs
          make -j -C include && make -j -C doc
          rm -rf ./api/html/Nodes.xml Info.plist Makefile Tokens.xml
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./api/html
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
